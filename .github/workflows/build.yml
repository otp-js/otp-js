name: Build

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x, 22.x]
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install
              run: pnpm i
            - name: Test
              run: pnpm test
    release:
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup
              uses: actions/setup-node@v3
              with:
                  node-version: 24.x
            - name: Install
              run: pnpm i
            - name: Test
              run: pnpm dlx c8 --reporter=lcovonly --reporter=text --include='packages/*/lib/**/*.js' --include='serializers/*/lib/**/*.js' --include='transports/*/lib/**/*.js' pnpm test
            - name: Report Coverage
              run: cat ./coverage/lcov.info | pnpm dlx coveralls
            - name: Add Release Channel
              if: ${{ startsWith(github.ref, 'refs/heads/develop') }}
              run: |
                    echo "NX_FLAGS=--preid next --specifier prerelease" >> $GITHUB_ENV
            - name: Release
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: pnpm dlx nx release $NX_FLAGS
