name: Build

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Setup
              uses: actions/setup-node@v3
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install
              run: npm ci
            - name: Build
              run: npm run build --if-present
            - name: Test
              run: npm run test
    release:
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Setup
              uses: actions/setup-node@v3
              with:
                  node-version: 24.x
            - name: Install
              run: npm ci
            - name: Build
              run: npm run build --if-present
            - name: Test
              run: npx c8 --reporter=lcovonly --reporter=text npm run test
            - name: Report Coverage
              run: cat ./coverage/lcov.info | npx coveralls
            - name: Release
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npx semantic-release
